name: Agent-and-API

on:
  push:
    branches: [main]
    paths:
      - "Agent/**"
      - "weather_backend/**"
      - "vectorstore/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/agent-training.yml"
  workflow_run:                   # a new model was just uploaded: rebuild the image with it
    workflows: ["Model-Training"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: model-and-image          # never runs at the same time as Model-Training
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    # when started by the model pipeline, continue only if that run succeeded
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository         
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Fetch the latest model from S3
        run: |
          aws s3 sync "s3://${{ secrets.AWS_S3_BUCKET }}/latest_model/" latest_model/ --only-show-errors
          for file in lstm_weather_model.keras scaler.pkl config.json metrics.json; do
            test -s "latest_model/$file" || { echo "Missing model file: $file"; exit 1; }
          done
          test -s vectorstore/chroma/chroma.sqlite3 || { echo "vectorstore/chroma is missing from the repo"; exit 1; }
          ls -la latest_model

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/weather-backend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/weather-backend:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/weather-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/weather-backend:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GROQ_API_KEY
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/weather-backend:latest
            sudo docker stop weather-backend || true
            sudo docker rm weather-backend || true
            sudo docker run -d \
              --name weather-backend \
              --restart unless-stopped \
              -p 8000:8000 \
              -e GROQ_API_KEY="$GROQ_API_KEY" \
              ${{ secrets.DOCKERHUB_USERNAME }}/weather-backend:latest
              
