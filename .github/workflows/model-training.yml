name: Model-Training

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/train.yaml"
      - "requirements-train.txt"
      - ".github/workflows/model-training.yml"
  workflow_dispatch:

concurrency:
  group: model-and-image          # never runs at the same time as Agent-and-API
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  train-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt

      - name: Fetch latest data
        run: python -m src.fetch_data

      - name: Train the model
        run: python -m src.train_lstm

      - name: Quality check
        run: python -m src.gate

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Upload the model to S3 (replaces the previous one)
        run: |
          aws s3 sync artifacts/forecast-model/_work/ \
            "s3://${{ secrets.AWS_S3_BUCKET }}/latest_model/" \
            --exclude "best_lstm.keras" --delete --only-show-errors
